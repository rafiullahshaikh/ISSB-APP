project_id = "qiyadat-local"

[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 100

[db]
port = 55322
shadow_port = 55320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 55323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 55324

[storage]
enabled = true
file_size_limit = "8MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:8080"
additional_redirect_urls = []
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
otp_length = 6
otp_expiry = 600

[edge_runtime]
enabled = true

[analytics]
enabled = false

[functions.api]
enabled = true
verify_jwt = false
entrypoint = "./functions/api/index.ts"

[functions.feedback-worker]
enabled = true
verify_jwt = false
entrypoint = "./functions/feedback-worker/index.ts"
